[package]
name = "ww_tap_decoder"
version = "0.1.0"
publish = false
authors.workspace = true
description = "Decoder of WireWeaver link tap captures: frames, messages and API calls from ww_tape blocks, with link stats"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client.workspace = true
ww_client_server = { workspace = true, features = ["std"] }
ww_framer = { workspace = true, features = ["std"] }
ww_link = { workspace = true, features = ["std"] }
ww_self.workspace = true
ww_snapshots.workspace = true
ww_tap = { workspace = true, features = ["std"] }
ww_tape = { workspace = true, features = ["std"] }
ww_version = { workspace = true, features = ["std"] }

[dev-dependencies]
crc.workspace = true
global_fixture_api = { workspace = true, features = ["std"] }
tap_api.workspace = true
tests_common.workspace = true
tokio.workspace = true
wire_weaver_client = { workspace = true, features = ["in_process"] }
ww_device = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["std"] }
ww_stream.workspace = true

[lints]
workspace = true
