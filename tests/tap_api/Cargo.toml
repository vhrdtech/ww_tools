[package]
name = "tap_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Test API of the tap decoder's end-to-end tests (TR-14): calls, properties, a global trait, a quantity by reference"

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# turns no_std off and forwards std to ww_api, global_fixture_api and ww_si
std = ["ww_api/std", "global_fixture_api/std", "ww_si/std"]

[dependencies]
global_fixture_api.workspace = true
ww_api.workspace = true
ww_si = { workspace = true, features = ["dimensionless"] }

[lints]
workspace = true
